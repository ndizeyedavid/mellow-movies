name: Desktop Release

on:
  push:
    branches: [main]
    paths:
      - "RELEASE.md"
      - "desktop/RELEASE.md"
      - ".github/workflows/desktop-release.yml"
  workflow_dispatch:
    inputs:
      version:
        description: "Override version (e.g. 1.0.1) — leave empty to read from RELEASE.md"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: desktop-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Checkout (full history for tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node (LTS, for Electron 32)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            desktop/package-lock.json

      - name: Parse version from RELEASE.md
        id: version
        shell: pwsh
        run: |
          $override = "${{ inputs.version }}"
          if ($override) {
            $version = $override.Trim().TrimStart("v")
          } else {
            $releaseFile = if (Test-Path "RELEASE.md") { "RELEASE.md" } elseif (Test-Path "desktop/RELEASE.md") { "desktop/RELEASE.md" } else { throw "No RELEASE.md found" }
            $text = Get-Content $releaseFile -Raw
            # First ## [1.0.0] or ## 1.0.0 or # v1.0.0
            $m = [regex]::Match($text, '(?m)^#{1,2}\s*\[?v?(\d+\.\d+\.\d+)\]?')
            if (-not $m.Success) { throw "Could not parse version from $releaseFile — add a header like '## [1.0.1] - YYYY-MM-DD'" }
            $version = $m.Groups[1].Value
          }
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Invalid semver: $version" }
          # semver sanity: must be newer than latest tag if any
          $latest = ""
          try { $latest = (git tag --sort=-v:refname | Select-Object -First 1).TrimStart("v") } catch {}
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "latest=$latest" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Version from RELEASE.md: $version (latest tag: $latest)"

      - name: Check if tag already exists
        id: check
        shell: pwsh
        run: |
          $tag = "v${{ steps.version.outputs.version }}"
          $exists = $false
          try { git rev-parse -q --verify "refs/tags/$tag" | Out-Null; if ($LASTEXITCODE -eq 0) { $exists = $true } } catch {}
          # also check remote
          if (-not $exists) { try { git ls-remote --tags origin "refs/tags/$tag" | Out-Null; if ($LASTEXITCODE -eq 0 -and (git ls-remote --tags origin "refs/tags/$tag")) { $exists = $true } } catch {} }
          if ($exists) {
            Write-Host "Tag $tag already exists — skipping build/release (idempotent)."
            "skip=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } else {
            Write-Host "Tag $tag is new — proceeding to build."
            "skip=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }

      - name: Sync version into desktop/package.json
        if: steps.check.outputs.skip == 'false'
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $pkgPath = "desktop/package.json"
          $pkg = Get-Content $pkgPath -Raw | ConvertFrom-Json
          $old = $pkg.version
          if ($old -ne $version) {
            Write-Host "Bumping desktop/package.json $old -> $version"
            $pkg.version = $version
            ($pkg | ConvertTo-Json -Depth 10) | Set-Content $pkgPath -Encoding utf8
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add $pkgPath
            git commit -m "chore(desktop): bump to v$version (from RELEASE.md)" || Write-Host "no commit needed"
            git push origin HEAD:main
          } else { Write-Host "package.json already at $version" }

      - name: Extract release notes
        if: steps.check.outputs.skip == 'false'
        id: notes
        shell: pwsh
        run: |
          $releaseFile = if (Test-Path "RELEASE.md") { "RELEASE.md" } else { "desktop/RELEASE.md" }
          $version = "${{ steps.version.outputs.version }}"
          $text = Get-Content $releaseFile -Raw
          # Capture section under the version header until next ## [
          $pattern = "(?ms)^#{1,2}\s*\[?v?$([regex]::Escape($version))\]?[^\n]*\n(.*?)(?=^#{1,2}\s*\[?v?\d+\.\d+\.\d+\]?|\z)"
          # Fix escaped pattern — re-evaluate
          $pattern = "(?ms)^#{1,2}\s*\[?v?" + [regex]::Escape($version) + "\]?[^\n]*\n(.*?)(?=^#{1,2}\s*\[?v?\d+\.\d+\.\d+\]?|\z)"
          $section = ""
          if ($text -match $pattern) { $section = $matches[1].Trim() } else { $section = $text.Trim().Substring(0, [Math]::Min(8000, $text.Length)) }
          if (-not $section) { $section = "Release $version — see RELEASE.md for details." }
          Set-Content -Path release-notes.md -Value $section -Encoding utf8
          Write-Host "Release notes:`n$section"

      - name: Install desktop deps
        if: steps.check.outputs.skip == 'false'
        working-directory: desktop
        run: npm ci

      - name: Build desktop (vite + electron-builder)
        if: steps.check.outputs.skip == 'false'
        working-directory: desktop
        run: npm run build:win

      - name: Create tag + GitHub Release
        if: steps.check.outputs.skip == 'false'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v${{ steps.version.outputs.version }}"
          $version = "${{ steps.version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Ensure we are on latest main after the version bump commit
          git pull --rebase origin main
          git tag $tag
          git push origin $tag
          $artifacts = @()
          $artifacts += Get-ChildItem "desktop/dist/*.exe" -ErrorAction SilentlyContinue | ForEach-Object { $_.FullName }
          $artifacts += Get-ChildItem "desktop/dist/*.yml" -ErrorAction SilentlyContinue | ForEach-Object { $_.FullName }
          $artifacts += Get-ChildItem "desktop/dist/*.blockmap" -ErrorAction SilentlyContinue | ForEach-Object { $_.FullName }
          if ($artifacts.Count -eq 0) { throw "No artifacts found in desktop/dist/" }
          Write-Host "Artifacts: $($artifacts -join ', ')"
          gh release create $tag `
            --title "Mellow Movies $tag" `
            --notes-file release-notes.md `
            --target ${{ github.sha }} `
            --generate-notes `
            @artifacts
          Write-Host "Release $tag created."

      - name: Summary
        if: steps.check.outputs.skip == 'false'
        run: echo "Published v${{ steps.version.outputs.version }} with installers."
