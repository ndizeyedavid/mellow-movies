name: Desktop Release

on:
  push:
    branches: [main]
    paths:
      - "RELEASE.md"
      - "desktop/RELEASE.md"
      - ".github/workflows/desktop-release.yml"
  workflow_dispatch:
    inputs:
      version:
        description: "Override version (e.g. 1.0.1) - leave empty to read from RELEASE.md"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: desktop-release
  cancel-in-progress: false

jobs:
  parse-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - name: Checkout (full history for tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Parse version from RELEASE.md
        id: version
        shell: pwsh
        run: |
          $override = "${{ inputs.version }}"
          if ($override) {
            $version = $override.Trim().TrimStart("v")
          } else {
            $releaseFile = if (Test-Path "RELEASE.md") { "RELEASE.md" } elseif (Test-Path "desktop/RELEASE.md") { "desktop/RELEASE.md" } else { throw "No RELEASE.md found" }
            $text = Get-Content $releaseFile -Raw
            $m = [regex]::Match($text, '(?m)^#{1,2}\s*\[?v?(\d+\.\d+\.\d+)\]?')
            if (-not $m.Success) { throw "Could not parse version from $releaseFile" }
            $version = $m.Groups[1].Value
          }
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Invalid semver: $version" }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Version from RELEASE.md: $version"

      - name: Check if tag already exists
        id: check
        shell: pwsh
        run: |
          $tag = "v${{ steps.version.outputs.version }}"
          $exists = $false
          try { git rev-parse -q --verify "refs/tags/$tag" | Out-Null; if ($LASTEXITCODE -eq 0) { $exists = $true } } catch {}
          if (-not $exists) { try { if (git ls-remote --tags origin "refs/tags/$tag") { $exists = $true } } catch {} }
          if ($exists) {
            Write-Host "Tag $tag already exists - skipping."
            "skip=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } else {
            Write-Host "Tag $tag is new - proceeding."
            "skip=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }

  sync-version:
    needs: parse-version
    if: needs.parse-version.outputs.skip == 'false'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync version into desktop/package.json
        shell: pwsh
        run: |
          $version = "${{ needs.parse-version.outputs.version }}"
          $pkgPath = "desktop/package.json"
          $pkg = Get-Content $pkgPath -Raw | ConvertFrom-Json
          if ($pkg.version -ne $version) {
            $pkg.version = $version
            ($pkg | ConvertTo-Json -Depth 10) | Set-Content $pkgPath -Encoding utf8
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add $pkgPath
            git commit -m "chore(desktop): bump to v$version (from RELEASE.md)" || Write-Host "no commit needed"
            git push origin HEAD:main
          } else { Write-Host "package.json already at $version" }

  build-core:
    needs: [parse-version, sync-version]
    if: needs.parse-version.outputs.skip == 'false'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: ubuntu-latest
            platform: linux
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install desktop deps
        working-directory: desktop
        run: npm ci

      - name: Build desktop
        working-directory: desktop
        run: npm run build

      - name: Package (${{ matrix.platform }})
        working-directory: desktop
        run: npx electron-builder --${{ matrix.platform }} --config --publish never

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}
          path: |
            desktop/dist/*.exe
            desktop/dist/*.zip
            desktop/dist/*.AppImage
            desktop/dist/*.deb
            desktop/dist/*.yml
            desktop/dist/*.blockmap
          if-no-files-found: ignore

  build-mac:
    needs: [parse-version, sync-version]
    if: needs.parse-version.outputs.skip == 'false'
    runs-on: macos-14
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install desktop deps
        working-directory: desktop
        run: npm ci

      - name: Build desktop
        working-directory: desktop
        run: npm run build

      - name: Package (mac)
        working-directory: desktop
        run: npx electron-builder --mac --config --publish never

      - name: Upload artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-mac
          path: |
            desktop/dist/*.zip
            desktop/dist/*.blockmap
          if-no-files-found: ignore

  release:
    needs: [parse-version, build-core, build-mac]
    if: needs.parse-version.outputs.skip == 'false'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: desktop/dist
          merge-multiple: true

      - name: Extract release notes
        id: notes
        shell: pwsh
        run: |
          $releaseFile = if (Test-Path "RELEASE.md") { "RELEASE.md" } else { "desktop/RELEASE.md" }
          $version = "${{ needs.parse-version.outputs.version }}"
          $text = Get-Content $releaseFile -Raw
          $pattern = "(?ms)^#{1,2}\s*\[?v?" + [regex]::Escape($version) + "\]?[^\n]*\n(.*?)(?=^#{1,2}\s*\[?v?\d+\.\d+\.\d+\]?|\z)"
          $section = ""
          if ($text -match $pattern) { $section = $matches[1].Trim() } else { $section = $text.Trim().Substring(0, [Math]::Min(8000, $text.Length)) }
          if (-not $section) { $section = "Release $version - see RELEASE.md for details." }
          Set-Content -Path release-notes.md -Value $section -Encoding utf8

      - name: Create tag + GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v${{ needs.parse-version.outputs.version }}"
          $version = "${{ needs.parse-version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          git tag $tag
          git push origin $tag
          $artifacts = @()
          $artifacts += Get-ChildItem "desktop/dist/*.exe" -ErrorAction SilentlyContinue | ForEach-Object { $_.FullName }
          $artifacts += Get-ChildItem "desktop/dist/*.dmg" -ErrorAction SilentlyContinue | ForEach-Object { $_.FullName }
          $artifacts += Get-ChildItem "desktop/dist/*.zip" -ErrorAction SilentlyContinue | ForEach-Object { $_.FullName }
          $artifacts += Get-ChildItem "desktop/dist/*.AppImage" -ErrorAction SilentlyContinue | ForEach-Object { $_.FullName }
          $artifacts += Get-ChildItem "desktop/dist/*.deb" -ErrorAction SilentlyContinue | ForEach-Object { $_.FullName }
          $artifacts += Get-ChildItem "desktop/dist/*.yml" -ErrorAction SilentlyContinue | ForEach-Object { $_.FullName }
          $artifacts += Get-ChildItem "desktop/dist/*.blockmap" -ErrorAction SilentlyContinue | ForEach-Object { $_.FullName }
          if ($artifacts.Count -eq 0) { throw "No artifacts found" }
          Write-Host "Artifacts: $($artifacts -join ', ')"
          gh release create $tag `
            --title "Mellow Movies $tag" `
            --notes-file release-notes.md `
            --target ${{ github.sha }} `
            --generate-notes `
            @artifacts
          Write-Host "Release $tag created."

      - name: Summary
        run: echo "Published v${{ needs.parse-version.outputs.version }} with cross-platform installers."
