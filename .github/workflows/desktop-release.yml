name: Desktop Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  desktop-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri/target

      - name: Install backend deps
        run: |
          pip install -r backend/requirements.txt
          pip install pyinstaller

      - name: Frontend deps
        working-directory: frontend
        run: npm ci

      # Builds the SPA, freezes backend + SPA into the sidecar exe, drops it
      # into the Tauri binaries slot.
      - name: Build backend sidecar
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File scripts/build-backend.ps1

      - name: Desktop deps
        working-directory: desktop
        run: npm ci

      # Compiles the Rust shell + bundles the NSIS installer.
      - name: Build + bundle desktop app
        working-directory: desktop
        run: npx tauri build --bundles nsis

      # Release body = the CHANGELOG section matching the app version,
      # falling back to the whole changelog when no section exists yet.
      - name: Prepare release notes
        id: notes
        shell: pwsh
        run: |
          $version = (Get-Content desktop/package.json | ConvertFrom-Json).version
          $changelog = Get-Content CHANGELOG.md -Raw
          $pattern = "(?ms)^## \[$([regex]::Escape($version))\][^\n]*\n(.*?)(?=^## \[|\z)"
          $section = if ($changelog -match $pattern) { $matches[1].Trim() } else { $changelog.Trim() }
          Set-Content -Path release-notes.md -Value $section -Encoding utf8
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Create tag + release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v${{ steps.notes.outputs.version }}"
          if (git rev-parse -q --verify "refs/tags/$tag") {
            Write-Host "Tag $tag already exists — skipping tag/release creation."
            exit 0
          }
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag $tag
          git push origin $tag
          $files = Get-ChildItem "desktop/src-tauri/target/release/bundle/nsis/*.exe" | ForEach-Object { $_.FullName }
          gh release create $tag `
            --title "Mellow Movies $tag" `
            --notes-file release-notes.md `
            --target ${{ github.sha }} `
            $files
