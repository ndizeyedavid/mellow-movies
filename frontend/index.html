<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mellow Movies — Stream Movies & Shows</title>
  <meta name="description" content="Mellow Movies — free movies & shows, beautifully delivered. Search, continue watching, and press play. No login. No ads." />
  <meta name="keywords" content="movies, tv shows, streaming, free movies, watch online, mellow movies" />
  <link rel="canonical" href="https://mellowmovies.vercel.app/" />
  <meta name="theme-color" content="#141414" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="apple-touch-icon" href="/icon-192.png" />
  <link rel="manifest" href="/manifest.webmanifest" />

  <!-- Open Graph / WhatsApp / Telegram — MUST be absolute 1200x630 per spec -->
  <!-- Chat preview uses public/seo-image.png (the image you placed). og-image.png is a 1200x630 derivative. -->
  <meta property="og:site_name" content="Mellow Movies" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://mellowmovies.vercel.app/" />
  <meta property="og:title" content="Mellow Movies — Stream Movies & Shows" />
  <meta property="og:description" content="Free movies & shows, beautifully delivered. No login, no ads — just press play. Continue watching, My List, and real posters. ✦ Free to watch." />
  <meta property="og:image" content="https://mellowmovies.vercel.app/seo-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="Mellow Movies — Relax. Watch. Enjoy." />
  <!-- Twitter / X -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Mellow Movies — Stream Movies & Shows" />
  <meta name="twitter:description" content="Free movies & shows, beautifully delivered. No login, no ads — just press play." />
  <meta name="twitter:image" content="https://mellowmovies.vercel.app/seo-image.png" />

  <!-- Preconnects -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" />

  <!-- JSON-LD for Google -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "Mellow Movies",
    "url": "https://mellowmovies.vercel.app/",
    "description": "Free movies & shows, beautifully delivered.",
    "potentialAction": {
      "@type": "SearchAction",
      "target": "https://mellowmovies.vercel.app/search?q={search_term_string}",
      "query-input": "required name=search_term_string"
    }
  }
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
